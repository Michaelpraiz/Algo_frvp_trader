[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-mcp-server"
version = "0.1.0"
description = "MetaTrader 5 MCP server for SMC and FRVP market analysis"
requires-python = ">=3.11"
dependencies = [
    "MetaTrader5>=5.0.45",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
